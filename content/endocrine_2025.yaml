# ===========================================================================
- title: "DIABETES — {{glucose control}}"
  kicker: "endocrine · sheet 1 · normal physiology, definition, epidemiology"
  accent: orange
  modules:

    - type: definition
      title: "What diabetes is"
      accent: teal
      term: "Diabetes"
      body: >-
        a syndrome which has ==hyperglycaemia as its hallmark==, due to an
        **absolute** lack of insulin (Type 1, formerly insulin dependent
        diabetes, [[IDDM]]) or a **relative** lack of insulin (Type 2,
        formerly non-insulin dependent diabetes, [[NIDDM]]).
      chips:
        - {k: "Normal glucose", v: "3.5–7 mmol/ml"}
        - {k: "Type 1", v: "absolute lack"}
        - {k: "Type 2", v: "relative lack"}

    - type: facts
      title: "Normal control"
      accent: green
      body: "Blood glucose is held at `3.5–7 mmol/ml` by two opposing pancreatic hormones."
      items:
        - "[[Insulin]] — produced by the **beta-cells** of the pancreas."
        - "[[Glucagon]] — produced by the **alpha cells** of the pancreas."
        - "A rise in glucose stimulates insulin, which removes glucose from blood and stores it as **glycogen** in muscle and liver."
        - "Insulin also stimulates **synthesis of fat** from adipose tissue, stored as triglyceride."
        - "A fall in glucose reduces insulin and stimulates glucagon, which **mobilises stored glucose** from liver and adipose tissue."

    - type: diagram
      title: "Glucose homeostasis"
      accent: teal
      span: 2
      kind: feedback_loop
      caption: "The two-armed control loop that diabetes breaks — insulin is the only hormone that lowers glucose."
      spec:
        centre:
          label: "BLOOD GLUCOSE"
          sub: "3.5–7 mmol/ml"
          note: "the regulated variable — hyperglycaemia is the hallmark of diabetes"
        arms:
          - title: "GLUCOSE RISES"
            accent: green
            sign: "−"
            trigger: "Increase in blood glucose"
            effector: "INSULIN\nbeta-cells"
            via: "removal from blood · storage as glycogen in muscle + liver · fat synthesis in adipose tissue"
            effect: "lowers blood glucose"
          - title: "GLUCOSE FALLS"
            accent: orange
            sign: "+"
            trigger: "Fall in blood glucose"
            effector: "GLUCAGON\nalpha cells"
            via: "insulin secretion reduced · stored glucose mobilised from liver + adipose tissue"
            effect: "raises blood glucose"

    - type: stats
      title: "Diabetes in the UK"
      accent: blue
      items:
        - {v: "1.4M", l: "have a diagnosis of diabetes"}
        - {v: "~3%", l: "of the population"}
        - {v: "1M+", l: "more thought to be undiagnosed"}
      footnote: "Diabetes becomes more common with age: Type 2 is present in `5–10%` of over-65s."

    - type: facts
      title: "Who gets it"
      accent: ochre
      items:
        - "**Men** are one and a half times as likely to be diagnosed as women — *except* women who are overweight."
        - "[[IDDM]] is very rare under **9 months** of age; peak incidence of onset is `5–15 years`."
        - "It is the **second commonest chronic illness of childhood**."
        - "About `30%` of IDDM cases present in patients **older than 30 years**."

    - type: clinical
      title: "Late-onset Type 1"
      accent: violet
      body: >-
        In older patients symptoms can be **less dramatic** and may initially be
        thought to be NIDDM. These patients are usually **non-obese**, have a
        history of **weight loss**, and respond **poorly to oral hypoglycaemic
        agents**.

    - type: table
      title: "Primary vs secondary"
      accent: ochre
      body: "The **majority** of cases are *primary* diabetes."
      columns: ["Group", "Cause"]
      rows:
        - ["Primary", "The majority of all cases of diabetes"]
        - ["Secondary", "Pancreatic carcinoma"]
        - ["", "Liver disease, particularly cirrhosis"]
        - ["", "Gestational diabetes mellitus"]

    - type: exam
      title: "Exam point"
      accent: ochre
      items:
        - "Insulin is the **only** hormone that lowers blood glucose; glucagon, and the loss of insulin, both raise it."
        - "Type 1 = **absolute** lack. Type 2 = **relative** lack. This single distinction drives every difference in presentation and treatment."
        - "`30%` of IDDM presents over the age of 30 — a non-obese adult with weight loss who fails oral agents is Type 1 until proven otherwise."

# ===========================================================================
- title: "TYPE 1 vs TYPE 2 — {{causes & presentation}}"
  kicker: "endocrine · sheet 2 · aetiology, defining features, symptoms"
  accent: orange
  modules:

    - type: mechanism
      title: "Cause of Type 1 (IDDM)"
      accent: violet
      body: >-
        An **autoimmune disorder** characterised by pancreatic
        ==beta-cell destruction==. Dietary factors may also be involved:
        absorption of **cow's milk proteins** through the immature gut
        (i.e. at 3 months of age) may set off an immune response leading to
        destruction of the beta-cells.

    - type: mechanism
      title: "Cause of Type 2 (NIDDM)"
      accent: violet
      body: >-
        Described as a ==lifestyle disease==, developing in people who are
        **genetically predisposed**, where environmental factors — nutrition
        (particularly obesity) and exercise — modulate expression of the
        diabetic phenotype.
      items:
        - "A **family history of Type 2** remains the *strongest single risk factor*."

    - type: diagram
      title: "Three abnormalities in Type 2"
      accent: teal
      span: 2
      kind: hierarchy
      caption: "A receptor defect — fewer receptors, or reduced receptor sensitivity — reduces glucose uptake and causes hyperglycaemia."
      spec:
        root:
          label: "TYPE 2 DIABETES"
          sub: "three main abnormalities"
          accent: violet
        children:
          - label: "Peripheral insulin resistance"
            accent: orange
            items:
              - "Defect of the insulin receptor mechanism"
              - "Decreased NUMBER of receptors, or"
              - "Decreased SENSITIVITY of receptors"
              - "Glucose uptake falls → hyperglycaemia"
          - label: "Increased hepatic glucose production"
            accent: red
            items:
              - "Liver continues to release glucose"
              - "Adds to the circulating load"
          - label: "Reduced pancreatic insulin secretion"
            accent: teal
            items:
              - "Relative — not absolute — lack of insulin"
              - "Distinguishes Type 2 from Type 1"

    - type: diagram
      title: "Defining features"
      accent: teal
      span: 2
      kind: compare
      spec:
        vs: "vs"
        left:
          label: "TYPE 1"
          accent: red
          items:
            - "Sudden onset"
            - "Severe symptoms, including ketoacidosis — coma in some"
            - "Recent weight loss"
            - "Onset more acute; many are admitted to hospital"
        right:
          label: "TYPE 2"
          accent: teal
          items:
            - "Gradual onset"
            - "May be no symptoms"
            - "Often no weight loss"
            - "Usually obese"
            - "Not ketotic"
            - "Slower onset of symptoms"

    - type: facts
      title: "Signs and symptoms"
      accent: red
      items:
        - "Increased urine output ([[polyuria]]) and excessive thirst ([[polydipsia]])."
        - "**Weight loss and weakness** due to tissue breakdown."
        - "**Blurred vision.**"

    - type: mistake
      title: "Why Type 2 is missed"
      accent: red
      body: >-
        Patients may attribute vague symptoms such as **dry mouth** and
        **poor concentration** to increasing age, not to diabetes. Only as
        glucose values rise do polyuria, thirst or weight loss become
        apparent and cause patients to seek help.

    - type: mechanism
      title: "The receptor defect"
      accent: violet
      body: >-
        A defect of the **insulin receptor mechanism** — either a *decreased
        number* of receptors or *decreased sensitivity* of the receptors —
        reduces glucose uptake, causing ==hyperglycaemia==.
      chips:
        - {k: "Fewer receptors", v: "↓ uptake"}
        - {k: "Less sensitive", v: "↓ uptake"}
        - {k: "Net effect", v: "hyperglycaemia"}

    - type: facts
      title: "Where the symptoms come from"
      accent: teal
      items:
        - "**Polyuria** — glucose spills into urine and drags water with it."
        - "**Polydipsia** — thirst follows the urinary water loss."
        - "**Weight loss and weakness** — tissue breakdown, because glucose cannot be used as fuel."
        - "**Blurred vision** — an early and often-ignored complaint."

    - type: exam
      title: "Exam point"
      accent: ochre
      span: 2
      items:
        - "The **strongest single risk factor** for Type 2 is a *family history of Type 2* — not obesity, though obesity modulates how the phenotype is expressed."
        - "Type 1 is **autoimmune beta-cell destruction**; Type 2 is a *triad* — peripheral insulin resistance, increased hepatic glucose production, and reduced pancreatic insulin secretion."
        - "**Ketosis separates the two**: Type 1 presents with ketoacidosis, Type 2 is not ketotic."

# ===========================================================================
- title: "DIAGNOSIS & {{acute complications}}"
  kicker: "endocrine · sheet 3 · diagnostic criteria, DKA, non-ketotic hyperglycaemia"
  accent: orange
  modules:

    - type: diagram
      title: "How the diagnosis is made"
      accent: teal
      span: 2
      kind: flow
      caption: "Diagnosis is usually made by one of these two routes."
      spec:
        gap: 4.2
        side_w: 0.40
        steps:
          - label: "ROUTE 1 — CLASSIC SYMPTOMS PRESENT"
            accent: teal
            strong: true
            sub: "plus any ONE qualifying plasma glucose result"
            side: "Symptoms: polyuria, polydipsia, weight loss, blurred vision"
          - label: "ROUTE 2 — ASYMPTOMATIC PATIENT"
            accent: ochre
            strong: true
            sub: "TWO venous samples from any of the categories below, on TWO DIFFERENT DAYS"
            side: "Without symptoms a single abnormal result is not enough"

    - type: table
      title: "Qualifying results"
      accent: green
      span: 2
      columns: ["Test", "Threshold", "Condition"]
      align: ["", "n", ""]
      rows:
        - ["Fasting plasma glucose", "> 7.0 mmol/ml", "Fasted sample"]
        - ["Random plasma glucose", "> 11.1 mmol/ml", "Any time"]
        - ["Oral glucose tolerance test (OGTT)", "> 11.1 mmol/ml", "2 hours after 75 g anhydrous glucose"]

    - type: definition
      title: "Diabetic ketoacidosis"
      accent: red
      term: "DKA"
      body: >-
        an **acute, major, life-threatening** complication of diabetes,
        characterised by ==hyperglycaemia, ketoacidosis and ketonuria==.
      chips:
        - {k: "Initial presentation in", v: "up to 16% of Type 1"}
        - {k: "Mortality", v: "2–15%"}

    - type: facts
      title: "What precipitates DKA"
      accent: red
      body: "It is a **fairly common but serious** event, precipitated by:"
      items:
        - "**Infection** — e.g. a urinary tract infection"
        - "**Acute illness**"
        - "**Trauma**"
        - "**Missed insulin doses**"

    - type: diagram
      title: "Mechanism of DKA"
      accent: violet
      span: 2
      kind: flow
      caption: "Lack of insulin means glucose cannot be utilised as an energy source — so the liver burns fat instead."
      spec:
        gap: 3.8
        side_w: 0.34
        steps:
          - label: "Absolute or relative INSULIN DEFICIENCY"
            accent: red
            strong: true
            side: "The initiating defect"
          - label: "Glucose cannot enter cells for utilisation as metabolic fuel"
            accent: violet
            side: "Glucose accumulates in blood → hyperglycaemia"
          - label: "Liver rapidly breaks down FAT into KETONES to employ as a fuel source"
            accent: violet
            side: "The body's emergency fuel switch"
          - label: "Overproduction of ketones — they accumulate in blood and urine"
            accent: orange
            side: "Ketonuria"
          - label: "BLOOD TURNS ACIDIC — ketoacidosis"
            accent: red
            strong: true
            side: "Breath smells sweet, of acetone"

    - type: facts
      title: "Symptoms of DKA"
      accent: red
      marker: cross
      items:
        - "Thirst, polyuria, dehydration"
        - "Vomiting, hyperventilation, weakness"
        - "**Ketosis** — breath smells sweet, of acetone"
        - "Tachycardia, hypotension"
        - "Drowsiness, confusion, **coma**"

    - type: mechanism
      title: "Non-ketotic hyperglycaemia"
      accent: violet
      body: >-
        Occurs in patients with **Type 2 diabetes**. There is ==no production
        of ketones== because there *is* sufficient insulin present to prevent
        excessive lipolysis — but not enough for complete utilisation of
        glucose, hence hyperglycaemia.
      items:
        - "As there are no ketones, there is **no vomiting** and **no metabolic acidosis**."

    - type: exam
      title: "Exam point"
      accent: ochre
      span: 2
      items:
        - "The diagnostic thresholds are **fasting > `7.0 mmol/ml`** and **random or 2-hour OGTT > `11.1 mmol/ml`**. With symptoms, one result is enough; without symptoms, you need **two samples on two different days**."
        - "DKA vs non-ketotic hyperglycaemia is a question about *how much insulin is left*: enough to suppress lipolysis (no ketones, Type 2) or not (ketones, Type 1)."

# ===========================================================================
- title: "CHRONIC {{complications}}"
  kicker: "endocrine · sheet 4 · hypoglycaemia, retinopathy, nephropathy, neuropathy"
  accent: orange
  modules:

    - type: definition
      title: "The complications"
      accent: teal
      span: 2
      body: >-
        They include **hypoglycaemia** and problems relating to hyperglycaemia
        — e.g. *cystitis*, *skin infections* and *gingivitis* — but the most
        important are the ==vascular complications== (nephropathy and
        cardiovascular disease).
      items:
        - "These take an average of `15–20 years` to develop in **Type 1**."
        - "They may be encountered **more quickly** in Type 2 — indeed **may be present at diagnosis**."

    - type: facts
      title: "Hypoglycaemia — causes"
      accent: red
      body: "The **most common** complication in diabetics. In most cases the patient or carer should be able to initiate treatment."
      items:
        - "**Insufficient food intake** — skipping meals, vomiting, diarrhoea"
        - "**Excessive exercise**"
        - "**Hypoglycaemic drugs**"
        - "**Too much insulin**"

    - type: facts
      title: "Hypoglycaemia — symptoms"
      accent: red
      items:
        - "Nausea, hunger"
        - "Tachycardia, **paraesthesia in the fingers or lips**, excessive sweating, muscle tremor"
        - "Ataxia, blurred vision, headache, confusion, agitation, **coma and convulsions**"

    - type: diagram
      title: "Treating hypoglycaemia"
      accent: green
      span: 2
      kind: flow
      caption: "Rapid treatment is essential to avoid permanent cerebral damage."
      spec:
        gap: 4.0
        side_w: 0.38
        steps:
          - label: "ORAL GLUCOSE"
            accent: green
            strong: true
            sub: "initial treatment"
            side: "Patient or carer can usually start treatment themselves"
          - label: "INTRAVENOUS GLUCOSE — 50%, 20–50 ml"
            accent: ochre
            sub: "in severe cases"
            side: "If the patient cannot swallow safely"
          - label: "GLUCAGON 1 mg by DEEP IM INJECTION into the buttock"
            accent: orange
            sub: "if IV not available or cannot be given"
            side: "Effect within minutes — it increases plasma glucose by mobilising glycogen stored in the liver"

    - type: clinical
      title: "Retinopathy"
      accent: violet
      body: >-
        Diabetic retinopathy is the ==commonest cause of blindness==. In Type 1
        it starts after **10 or more years**; in Type 2 it may be **present at
        diagnosis**.
      chips:
        - {k: "Have retinopathy", v: "~30% of all diabetics"}
        - {k: "Laser, if detected early", v: "prevents 70% going blind"}
        - {k: "Eye checks", v: "yearly"}

    - type: clinical
      title: "Nephropathy"
      accent: violet
      body: "Diabetic nephropathy affects:"
      items:
        - "About **one in every three** individuals with **Type 1** diabetes."
        - "About **one in every 20** with **Type 2**."
        - "All people with diabetes should have urine tested **at least annually** for **proteinuria** and, if negative, for **microalbuminuria**."

    - type: clinical
      title: "Neuropathy"
      accent: violet
      body: >-
        Damage to **sensory, motor and autonomic** nerves, commonly occurring
        as a result of chronic hyperglycaemia.
      items:
        - "Impaired nerve function found in `60%` of diabetics; causes problems for **about a third** of them."
        - "Commonest manifestation: **reduced sensation in the feet** — an important factor in foot ulceration."
        - "Peripheral neuropathy also impairs **sweating**, leading to dry, cracked skin that may fail to heal."
        - "If ulceration is due to **peripheral vascular disease**, amputation is often needed."

    - type: takeaway
      title: "Key takeaway — the feet"
      accent: orange
      span: 2
      body: >-
        It is essential that each diabetic patient is **individually educated
        about foot care**, as ==most diabetic foot problems are entirely
        preventable== with good foot care and regular screening.

