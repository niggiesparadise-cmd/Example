- title: "INCRETINS, SGLT & {{monitoring}}"
  kicker: "endocrine · sheet 7 · newer agents, targets of control, HbA1c"
  accent: orange
  modules:

    - type: table
      title: "The newer agents"
      accent: teal
      span: 2
      columns: ["Class", "Example", "Mechanism", "Notes"]
      rows:
        - ["GLP-1 agonist", "Victoza", "Stimulates **glucose-dependent** insulin release from the pancreatic islets", "**Injectable.** Also slows gastric emptying, inhibits inappropriate post-meal glucagon release, reduces food intake"]
        - ["DPP-4 inhibitor (gliptins)", "Sitagliptin, saxagliptin, linagliptin", "Increases incretin levels (GLP-1 and GIP) → inhibits glucagon release → increases insulin secretion, decreases gastric emptying and blood glucose", "FDA approved. Adverse effects usually mild and transient: nasopharyngitis, headache, dizziness, arthralgia, nausea, constipation"]
        - ["SGLT1 inhibitor", "—", "Delays and reduces glucose absorption in the **small intestine**", "Improves post-meal control; useful where declining renal function makes SGLT2 inhibition less effective"]
        - ["SGLT2 inhibitor", "Canagliflozin", "Reduces **renal tubular glucose reabsorption**", "Lowers glucose **without stimulating insulin release**. Favourable effects on blood pressure and weight"]

    - type: clinical
      title: "Note on glibenclamide"
      accent: violet
      body: >-
        In patients **without renal or hepatic impairment**, glibenclamide may
        be used. They should be taken `30 minutes before meals` for maximum
        benefit.

    - type: facts
      title: "The newer agents at a glance"
      accent: teal
      marker: tick
      items:
        - "**GLP-1 agonists are injectable** — the others here are oral."
        - "DPP-4 inhibitors work **indirectly**, by raising incretin levels."
        - "SGLT2 inhibitors lower glucose ==without stimulating insulin release==."
        - "SGLT2 also has favourable effects on **blood pressure and weight**."

    - type: diagram
      title: "Fasting blood glucose — what is good control?"
      accent: green
      span: 2
      kind: scale
      caption: "Fasting blood glucose bands, with the units exactly as given in the source document."
      spec:
        bar_h: 9
        height: 27
        axis_label: "fasting blood glucose (mg/ml, as stated in the source)"
        bands:
          - {label: "GOOD", range: "< 108", accent: green, weight: 1}
          - {label: "ACCEPTABLE", range: "108–126", accent: teal, weight: 1}
          - {label: "POOR", range: "127–144", accent: ochre, weight: 1}
          - {label: "VERY POOR", range: "> 144", accent: red, weight: 1}

    - type: definition
      title: "The A1C test (HbA1c)"
      accent: blue
      span: 2
      term: "A1C"
      body: >-
        a blood test giving a person's **average blood glucose over the past
        3 months** — also called haemoglobin A1c, HbA1c. It is the
        ==primary test used for diabetes management==, reported as a
        percentage: the higher the percentage, the higher the blood glucose
        levels have been.
      items:
        - "RBCs are composed of **haemoglobin**. Glucose sticks to haemoglobin to make a **glycosylated haemoglobin molecule (HbA1c)**."
        - "The more glucose present in the blood, the more HbA1c will be present."
        - "RBCs are constantly forming and dying — they live for about `3 months`, so the test reflects the *average over that window*."

    - type: diagram
      title: "A1C levels"
      accent: blue
      span: 2
      kind: scale
      caption: "The treatment target for most people with diabetes is an A1C of ≤ 7%. Higher levels may need a more intensive medication plan."
      spec:
        bar_h: 9
        height: 30
        axis_label: "HbA1c (%)"
        marker: {at: 0.44, label: "target ≤ 7%", accent: violet}
        bands:
          - {label: "NORMAL", range: "below 5.7%", accent: green, weight: 1.1, note: "no diabetes"}
          - {label: "PREDIABETES", range: "5.7 – 6.4%", accent: ochre, weight: 1, note: "at risk"}
          - {label: "DIABETES", range: "6.5% or above", accent: red, weight: 1.3, note: "diagnostic level"}

