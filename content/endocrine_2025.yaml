- title: "THYROID — {{physiology & TFTs}}"
  kicker: "endocrine · sheet 9 · thyroid hormones, the HPT axis, function tests"
  accent: orange
  modules:

    - type: stats
      title: "How common"
      accent: blue
      items:
        - {v: "2%", l: "of women have hypothyroidism"}
        - {v: "0.13%", l: "of men have hypothyroidism"}
        - {v: "1–2%", l: "UK prevalence of hyperthyroidism"}
      footnote: "Most patients with hypothyroidism present between the ages of `30 and 60`; it is more common in those with a **family history of thyroid disease**. Hyperthyroidism has a **large female preponderance**."

    - type: definition
      title: "The two hormones"
      accent: teal
      body: >-
        The thyroid gland secretes two **iodine-containing** hormones:
        [[thyroxine (T4)]] and [[tri-iodothyronine (T3)]], produced by the
        **follicular cells** in response to **thyroid-stimulating hormone
        (TSH)** from the *anterior pituitary*.
      items:
        - "**T4 is the main hormone secreted** — but it is essentially a ==prohormone==."
        - "**Most of the effects are due to T3.**"

    - type: diagram
      title: "The hypothalamic–pituitary–thyroid axis"
      accent: teal
      span: 2
      kind: feedback_loop
      caption: "TSH from the anterior pituitary drives the follicular cells; the hormones produced feed back on it."
      spec:
        height: 66
        centre:
          label: "THYROID HORMONES"
          sub: "T4 (main) → T3 (active)"
          note: "> 99% protein bound, mainly to thyroxine-binding globulin (TBG) — only the free portion is active"
        arms:
          - title: "TOO LITTLE HORMONE"
            accent: teal
            sign: "+"
            trigger: "Free T4 / T3 falls"
            effector: "ANTERIOR PITUITARY\nTSH rises"
            via: "TSH stimulates the follicular cells of the thyroid gland"
            effect: "more T4 and T3 produced"
          - title: "TOO MUCH HORMONE"
            accent: red
            sign: "−"
            trigger: "Free T4 / T3 rises"
            effector: "ANTERIOR PITUITARY\nTSH suppressed"
            via: "less drive to the follicular cells of the thyroid gland"
            effect: "less T4 and T3 produced"

    - type: mechanism
      title: "What thyroid hormones do"
      accent: violet
      items:
        - "Increase the **basal metabolic rate** — raising *oxygen consumption* and *heat production*."
        - "Have a role in **growth and development**."
        - "**Nearly all body tissues are affected**, so an alteration in secretion affects the activity of *all body systems* — hence the wide-ranging symptoms."

    - type: technical
      title: "Protein binding"
      accent: blue
      body: >-
        `> 99%` of **both** hormones are protein bound — mainly to
        **thyroxine-binding globulin (TBG)**.
      items:
        - "==Only the free portion is active.=="
        - "So a change in the amount of TBG alters the measured result without necessarily changing thyroid status."
        - "This is why **clinical features must always be taken into account** alongside the numbers."

    - type: table
      title: "Reading the TFTs"
      accent: blue
      span: 2
      columns: ["Picture", "T4", "TSH", "Interpretation"]
      align: ["", "n", "n", ""]
      rows:
        - ["Primary thyroid failure", "low", "high", "A fall in serum total or free T4 **together with** a rise in serum TSH is **diagnostic**"]
        - ["\"Sub-clinical\" hypothyroidism", "normal", "high", "Check TFTs **yearly** — the *majority go on to develop clinical hypothyroidism*"]
        - ["Hyperthyroidism", "high", "suppressed", "Raised T4 **and** T3 with suppressed TSH"]

    - type: warning
      title: "Never test in isolation"
      accent: red
      span: 2
      body: >-
        Because the presenting symptoms are so **varied and non-specific**,
        biochemical confirmation is necessary — but these tests should
        ==never be used alone== to decide whether treatment is necessary.
        **Clinical features should always be taken into account.**
      items:
        - "Symptoms of hypothyroidism but **normal TFTs** → thyroxine can be *tried* to see if symptoms improve, as long as TFTs and clinical symptoms are monitored to check for over-treatment (i.e. hyperthyroidism)."
        - "**Abnormal TFTs without any signs or symptoms** → close monitoring, but **no treatment**."

    - type: exam
      title: "Exam point"
      accent: ochre
      span: 2
      items:
        - "Changes in **thyroid binding globulin (TBG)** would be expected to alter the results — because only the *free* portion of T3 and T4 is active."
        - "T4 is the main hormone secreted, but T3 does the work: **T4 is essentially a prohormone**."

# ===========================================================================
- title: "HYPOTHYROIDISM"
  kicker: "endocrine · sheet 10 · causes, clinical features, thyroxine replacement"
  accent: orange
  modules:

    - type: definition
      title: "The diagnosis"
      accent: teal
      span: 2
      body: >-
        A fall in serum **total or free T4** together with a **rise in serum
        TSH** is diagnostic of ==primary thyroid failure==. An elevated TSH
        with a *normal* T4 is termed **“sub-clinical” hypothyroidism** —
        such patients should have their TFTs checked **yearly**, as the
        majority go on to develop clinical hypothyroidism.

    - type: diagram
      title: "Causes"
      accent: violet
      span: 2
      kind: hierarchy
      caption: "More than 90% of cases are due to one of the first three."
      spec:
        root:
          label: "HYPOTHYROIDISM"
          sub: "> 90% of cases from the first group"
          accent: violet
        children:
          - label: "The main causes (> 90%)"
            accent: red
            items:
              - "Autoimmune hypothyroidism"
              - "Idiopathic atrophic hypothyroidism"
              - "Post-surgery, radioactive iodine and anti-thyroid drugs"
          - label: "Other causes"
            accent: ochre
            items:
              - "Congenital"
              - "Iodine deficiency"
          - label: "Drugs"
            accent: teal
            items:
              - "Lithium"
              - "Amiodarone"

    - type: facts
      title: "Clinical features — most common"
      accent: red
      body: "Onset may be with **non-specific symptoms** and, occasionally, *no symptoms*."
      items:
        - "**Tiredness**"
        - "**Cold intolerance**"
        - "Dryness and coarsening of **skin and hair**, subcutaneous swelling"
        - "**Hoarseness**"
        - "**Weight gain**"
        - "**Hyperlipidaemia**"

    - type: facts
      title: "Clinical features — others"
      accent: ochre
      items:
        - "Anaemia"
        - "Depression"
        - "Constipation"
        - "Bradycardia"
        - "Infertility"

    - type: diagram
      title: "Thyroxine replacement"
      accent: green
      span: 2
      kind: flow
      caption: "Hormone replacement, usually with T4 (thyroxine), is the treatment for hypothyroidism."
      spec:
        gap: 4.0
        side_w: 0.40
        steps:
          - label: "START THYROXINE 50 µ DAILY"
            accent: green
            strong: true
            sub: "the usual initial dose; the range is 25–200 µ daily"
            side: "Take at least HALF AN HOUR BEFORE BREAKFAST — food stops the drug being absorbed properly"
          - label: "INCREASE BY 50 µ EVERY 3–4 WEEKS"
            accent: teal
            side: "Symptomatic improvement is seen within 2–3 weeks"
          - label: "CHECK TSH AFTER 6 WEEKS OF THERAPY"
            accent: ochre
            strong: true
            sub: "it may be 6 weeks before TSH levels respond fully"
            side: "Adjust the dose by increments of 25–50 µ"
          - label: "ONCE TSH AND T4 ARE NORMAL AND THE PATIENT IS SYMPTOM-FREE"
            accent: blue
            sub: "assess adequacy of continuing treatment by ANNUAL TFTs"
            side: "Most patients receiving thyroxine require LIFE-LONG treatment"

    - type: exam
      title: "Exam point"
      accent: ochre
      span: 2
      items:
        - "The two time constants that matter: **symptoms improve in `2–3 weeks`**, but **TSH takes `6 weeks`** to respond fully — so do not re-check TSH earlier and do not chase the dose on symptoms alone."
        - "Thyroxine is absorbed poorly with food: **at least half an hour before breakfast**."

# ===========================================================================
- title: "HYPERTHYROIDISM"
  kicker: "endocrine · sheet 11 · causes, features, and the three treatment options"
  accent: orange
  modules:

    - type: definition
      title: "The diagnosis"
      accent: teal
      term: "Hyperthyroidism"
      body: >-
        ==Raised T4 and T3 with suppressed TSH.== As only the **free portion**
        of T3 and T4 is active, changes in the amount of **thyroid binding
        globulin (TBG)** would be expected to alter the results.

    - type: facts
      title: "Causes"
      accent: violet
      body: "More than `90%` of cases are due to either:"
      items:
        - "**Grave's disease** — an autoimmune disease."
        - "**Toxic multinodular goitre** — swelling of the thyroid."
        - "*Other causes:* thyroiditis (due to viral infection); exogenous iodine and iodine-containing drugs e.g. **amiodarone**; excessive T3 and T4 ingestion."

    - type: diagram
      title: "Clinical features"
      accent: red
      span: 2
      kind: compare
      spec:
        vs: "+"
        left:
          label: "MOST COMMONLY"
          accent: red
          items:
            - "Weight loss — but with a normal appetite"
            - "Sweating; heat intolerance"
            - "Increased rate and depth of respiration"
            - "Diarrhoea"
            - "Fatigue, generalised muscle weakness and muscle tremor"
            - "Palpitations; sinus tachycardia or atrial fibrillation; angina; heart failure"
        right:
          label: "OTHERS"
          accent: ochre
          items:
            - "Agitation"
            - "Insomnia"
            - "Infertility"
            - "The presenting features in mild cases may MIMIC AN ANXIETY STATE"

    - type: facts
      title: "Three treatment options"
      accent: teal
      marker: tick
      items:
        - "**Anti-thyroid drugs** — e.g. carbimazole"
        - "**Radioactive iodine**"
        - "**Surgery**"

    - type: mechanism
      title: "Carbimazole"
      accent: violet
      body: >-
        The plasma half-life of carbimazole is relatively **short (`6–10
        hours`)**, but its **biological effect is much longer** — which is what
        allows a ==once daily dose== to be given.

    - type: diagram
      title: "The 'block and replace' regimen"
      accent: green
      span: 2
      kind: flow
      caption: "Favoured because it reduces the high relapse rate of the previous regimen."
      spec:
        gap: 3.1
        side_w: 0.34
        steps:
          - label: "START CARBIMAZOLE 40 mg DAILY"
            accent: green
            strong: true
            sub: "high dose, to 'block' the activity of the thyroid"
            side: "Blocking, plus replacement therapy with thyroxine"
          - label: "MEASURE T4 AFTER 4 WEEKS"
            accent: teal
            side: "The decision point"
          - label: "IF NORMAL OR LOW → start thyroxine 100 mcg daily"
            accent: green
            side: "The 'replace' half of the regimen"
          - label: "IF HIGH → repeat at week 6. If STILL high → increase carbimazole to 60 mg daily"
            accent: ochre
            sub: "when T4 is normal, start thyroxine 100 mcg daily"
            side: "Block harder before replacing"
          - label: "MEASURE T4 4 WEEKS AFTER STARTING THYROXINE"
            accent: blue
            strong: true
            sub: "adjust the dose to keep T4 in the normal range"
            side: "Then maintain"

    - type: clinical
      title: "Radioactive iodine (¹³¹I)"
      accent: violet
      body: >-
        Given as a **tasteless liquid**. It causes ==necrosis of the overactive
        thyroid gland== without significant local or systemic effects, and with
        minimal radiation hazard.
      items:
        - "Treatment of choice for **toxic nodular hyperthyroidism** if the goitre is *not large*."
        - "And for **Grave's disease**, especially on relapse after medical treatment or subtotal thyroidectomy."
        - "About **two-thirds** are cured by a *single dose*; further doses at intervals of `2–4 months`."

    - type: warning
      title: "Radioiodine — cautions"
      accent: red
      items:
        - "**Contraindicated during pregnancy.**"
        - "Women who have received treatment should **not get pregnant for `3 months`** afterwards."
        - "All patients need **annual TFTs**: after `20 years`, `50%` will have developed **hypothyroidism**."

    - type: clinical
      title: "Surgery — sub-total thyroidectomy"
      accent: violet
      span: 2
      body: >-
        It is **rarely first choice**. Beta-blockers — usually **propranolol
        `20 mg tds`** — may provide *temporary symptomatic relief* prior to
        surgery, or until antithyroid drugs take their effect (about
        `4 weeks`).
