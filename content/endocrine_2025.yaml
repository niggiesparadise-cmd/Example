- title: "TREATMENT — {{insulin}}"
  kicker: "endocrine · sheet 5 · aims of treatment, insulin types, administration"
  accent: orange
  modules:

    - type: definition
      title: "Aim of treatment"
      accent: teal
      span: 2
      body: >-
        To achieve the ==best possible control of plasma glucose without
        inducing hypoglycaemia==, in order to prevent both the **micro-** and
        **macrovascular** complications of diabetes.
      chips:
        - {k: "Diet", v: "the cornerstone — both types"}
        - {k: "Type 1", v: "match energy + insulin intake"}
        - {k: "Type 2", v: "many controlled by diet alone"}
        - {k: "Exercise", v: "lowers glucose + increases insulin action"}

    - type: diagram
      title: "Insulin action profiles"
      accent: blue
      span: 2
      kind: curves
      caption: "Schematic curves drawn from the onset / peak / duration figures given in the source — the shapes show why the classes are combined."
      spec:
        height: 56
        legend_w: 32
        x_range: [0, 30]
        y_range: [0, 1.05]
        x_label: "hours after injection"
        y_label: "insulin action"
        x_ticks: [0, 2, 4, 6, 8, 12, 16, 20, 24, 30]
        y_ticks: []
        series:
          - label: "Rapid acting"
            peak_label: "peak 60–90 min"
            accent: red
            width: 0.42
            points: [[0,0],[0.25,0.10],[0.9,0.72],[1.3,1.0],[2,0.72],[3,0.34],[4,0]]
          - label: "Short acting"
            peak_label: "peak 2–3 h"
            accent: orange
            width: 0.42
            points: [[0,0],[0.6,0.06],[1.5,0.55],[2.5,0.88],[3,0.8],[4,0.5],[5,0.24],[6,0]]
          - label: "Intermediate (NPH / Lente)"
            peak_label: "peak 4–12 h"
            accent: green
            width: 0.42
            points: [[0,0],[3.2,0.06],[5,0.36],[7,0.6],[9,0.68],[12,0.62],[15,0.4],[18,0.16],[20,0]]
          - label: "Long acting"
            peak_label: "peak 12–16 h"
            accent: violet
            width: 0.42
            points: [[0,0],[6.5,0.05],[9,0.22],[12,0.38],[14,0.44],[18,0.42],[22,0.34],[26,0.2],[30,0]]

    - type: table
      title: "Insulin therapy — the four classes"
      accent: blue
      span: 2
      columns: ["Class", "Onset", "Peak", "Duration", "How it is used"]
      align: ["", "n", "n", "n", ""]
      rows:
        - ["Rapid acting", "15 min", "60–90 min", "2–4 h", "Before a meal, to cover the glucose rise from eating. Used **with** a longer-acting insulin."]
        - ["Short acting", "30–60 min", "2–3 h", "4–6 h", "About 30 min before a meal, to cover the glucose rise from eating. Used **with** a longer-acting insulin."]
        - ["Intermediate (NPH / Lente)", "3–4 h", "4–12 h", "16–20 h", "Covers glucose rises when rapid-acting insulins stop working. Often combined with rapid or short acting; usually **twice a day**."]
        - ["Long acting", "6–8 h", "12–16 h", "20–30 h", "Lowers glucose when rapid-acting insulins stop working. Combined when needed; taken **once or twice a day**."]

    - type: worked
      title: "Starting dose"
      accent: blue
      given: "A patient of 70 kg, newly started on insulin"
      formula: "dose = 0.5 units / kg / day"
      substitution: "0.5 × 70"
      result: "35 units per day"
      interpretation: "The dose is then adjusted according to the patient's blood glucose results."

    - type: process
      title: "Giving the injection"
      accent: ochre
      items:
        - "Give **30–45 minutes before food** where possible."
        - "Inject **subcutaneously** — front of the thighs, lower abdominal wall, upper arms."
        - "**Rotate sites daily** to prevent fibrosis, which interferes with insulin absorption."

    - type: warning
      title: "What speeds absorption"
      accent: red
      items:
        - "**Hot baths and showers** increase the absorption rate."
        - "**Leg exercise** increases the absorption rate from the thigh."

    - type: facts
      title: "Where insulin comes from"
      accent: violet
      body: >-
        Insulin is categorised by **how it is derived** and **how quickly it
        acts** — from rapid to long acting, from animal insulin through to
        analogue insulins.
      items:
        - "**Animal insulin** was the first type given to humans, derived from *cows and pigs*."
        - "Until the **1980s** it was the only treatment for insulin dependent diabetes."
        - "It has largely been replaced by **human insulin** and **human analogue insulin**."

    - type: facts
      title: "Insulin devices"
      accent: teal
      marker: tick
      items:
        - "Vial + syringe"
        - "Penfill cartridge + injection device"
        - "Flexpen (ready filled)"

# ===========================================================================
- title: "TYPE 2 — {{drug treatment}}"
  kicker: "endocrine · sheet 6 · lifestyle, escalation, oral agents and injectables"
  accent: orange
  modules:

    - type: facts
      title: "Components of treatment"
      accent: teal
      body: "Treatment varies from patient to patient; the aims are met by a **combination** of:"
      marker: tick
      items:
        - "Dietary adjustment"
        - "Weight loss in the obese"
        - "Adequate physical activity"
        - "Oral antidiabetic drugs"
        - "Patient education"

    - type: facts
      title: "Dietary advice"
      accent: green
      body: >-
        Unless a patient presents with severe symptoms, **diet and lifestyle
        modification alone** should be tried for at least `3 months`. Diet
        alone can control up to ==30%== of patients with Type 2.
      items:
        - "Reduce energy intake if obese — to `1000–1500 kCal` per day."
        - "Eat **regular meals**; include a wide variety of foods."
        - "**Limit** intake of sugar and sweet foods."
        - "**Reduce** total fat intake."

    - type: diagram
      title: "Drug escalation"
      accent: ochre
      span: 2
      kind: flow
      caption: "Drugs in dual therapy are introduced stepwise, checking tolerability and effectiveness of each drug."
      spec:
        gap: 4.0
        side_w: 0.40
        steps:
          - label: "DIET AND LIFESTYLE MODIFICATION ALONE"
            accent: green
            strong: true
            sub: "at least 3 months, unless severe symptoms"
            side: "Continue dietary recommendations even after drugs are started"
          - label: "STANDARD-RELEASE METFORMIN"
            accent: teal
            strong: true
            sub: "the initial drug treatment for adults with Type 2"
            side: "If metformin is contraindicated or not tolerated, go straight to dual therapy"
          - label: "ADD a second agent — DUAL THERAPY"
            accent: ochre
            sub: "sulfonylurea · DPP-4 inhibitor · GLP-1 agonist · SGLT inhibitor"
            side: "Added when metformin has not continued to control HbA1c"
          - label: "TRIPLE THERAPY"
            accent: orange
            sub: "if dual therapy has not succeeded"
            side: "Below the person's individually agreed HbA1c threshold"
          - label: "INSULIN-BASED TREATMENT"
            accent: red
            strong: true
            sub: "if there is still no control"
            side: "After 10 to 20 years, almost all patients with Type 2 will need insulin"

    - type: mechanism
      title: "Metformin (biguanide)"
      accent: violet
      body: >-
        Main effect: a ==reduction in hepatic gluconeogenesis==. It also
        **reduces intestinal glucose absorption** and **enhances insulin
        sensitivity**.
      items:
        - "Treatment of choice in **obese** patients, but *equally effective in non-obese*."
        - "Nausea, vomiting, flatulence and diarrhoea in up to `20%` of patients."
        - "Reduce these by starting low — e.g. `500 mg` daily with or after food — and increasing gradually."

    - type: mechanism
      title: "Sulphonylureas"
      accent: violet
      body: >-
        Main effect: **increasing the sensitivity of the pancreas to glucose**,
        thus increasing insulin output. Secondary effects: increased muscular
        uptake and reduced hepatic synthesis of glucose.
      items:
        - "**Primary failure** — `25–30%` of patients may not respond."
        - "**Secondary failure** — a further `5–10%` lose responsiveness *annually*."
        - "Second generation agents (glimepiride) are more potent, but there is **no evidence of clinically important differences in efficacy** within the group."
        - "Take `30 minutes before meals` for maximum benefit."

    - type: mistake
      title: "Switching sulphonylurea"
      accent: red
      body: >-
        It is unlikely that **if one sulphonylurea fails** to control
        hyperglycaemia, ==another will do so for any length of time==. Second
        generation agents are more potent, but there is *no evidence of
        clinically important differences in efficacy* within the group.

    - type: clinical
      title: "Emphasise this"
      accent: violet
      body: >-
        It is important to emphasise to patients the need to ==continue with
        dietary recommendations== **even if they are started on oral
        medication**.

    - type: warning
      title: "Sulphonylurea side-effects"
      accent: red
      body: "Most side effects are **shared by all** sulphonylureas."
      items:
        - "**Hypoglycaemia** — common, especially in the *elderly* and those with *renal or hepatic impairment*."
        - "**Weight gain** — can limit their usefulness in obese diabetic patients."
        - "**GI disturbances** — usually only on initiation, and should gradually wear off."
        - "**Rash** in about `3%`, usually in the first `6–8 weeks`."
        - "**Raised LFTs.**"

