- title: "THE CONTROL {{algorithm}}"
  kicker: "endocrine · sheet 8 · choosing treatment by level of control"
  accent: orange
  modules:

    - type: diagram
      title: "Initial blood glucose control"
      accent: teal
      span: 2
      kind: triage
      caption: "Redrawn in the notebook's visual language from the treatment figure in the source document."
      spec:
        height: 72
        base: "NUTRITION AND EXERCISE (always important)"
        base_accent: teal
        bands:
          - label: "GOOD"
            accent: green
            rows: ["A1c  < 8.0%", "Fasting  < 180", "Random  < 250"]
            no_action: "diet and exercise alone"
          - label: "FAIR"
            accent: ochre
            rows: ["A1c  8.0 – 9.5%", "Fasting  180–250", "Random  250–300"]
            action: "Oral agents, Incretins"
          - label: "POOR"
            accent: red
            rows: ["A1c  > 9.5%", "Fasting  > 250", "Random  > 300"]
            action: "Insulin"
        footnotes:
          - "FBG = fasting plasma blood glucose after not eating for at least 8 hours (normal: 70–100 mg/dL)"
          - "RBG = random plasma blood glucose, any time after last meal (normal: 100–150 mg/dL)"

    - type: facts
      title: "When to start insulin in Type 2"
      accent: red
      body: >-
        Although treatment starts with oral medication and lifestyle changes,
        **most people with Type 2 eventually need insulin**.
      items:
        - "Significant hyperglycaemia in a **symptomatic** patient — *\u201cthe need for insulin may be short-term\u201d*."
        - "Patients on **multiple diabetic medications** with uncontrolled diabetes."
        - "**Uncontrolled diabetes in pregnancy.**"
        - "*\u201cAfter 10 to 20 years, almost all patients with type 2 diabetes will need insulin.\u201d*"

    - type: takeaway
      title: "Key takeaway"
      accent: orange
      body: >-
        Control is not judged by a single number: the algorithm reads
        **A1c, fasting and random glucose together**, and every band sits on
        the same foundation of ==nutrition and exercise==.

    - type: exam
      title: "Exam point"
      accent: ochre
      items:
        - "*\u201cThe American Association of Clinical Endocrinologists recommends starting a person with type 2 diabetes on insulin if their A1C is above `9%` and they have symptoms.\u201d*"
        - "Blood sugar control is **one of the most important parts** of Type 2 management."
        - "A1C reflects **3 months** — because that is how long a red cell lives."

    - type: clinical
      title: "A1C in pregnancy"
      accent: violet
      items:
        - "The A1C test may be used at the **first visit during pregnancy**, to see if women with risk factors had **undiagnosed diabetes before becoming pregnant**."
        - "**OGTT** is used to test for diabetes that develops *during* pregnancy."
        - "After delivery, women who had **gestational diabetes** should be tested for **persistent diabetes**."

    - type: stats
      title: "Numbers to remember"
      accent: blue
      items:
        - {v: "≤ 7%", l: "A1C treatment target for most patients"}
        - {v: "> 9%", l: "A1C + symptoms → start insulin (AACE)"}
        - {v: "10–20 y", l: "until almost all Type 2 need insulin"}

    - type: summary
      title: "Summary — the Type 2 pathway"
      accent: green
      span: 2
      items:
        - "**Diet and lifestyle alone** for at least 3 months — controls up to `30%` of patients."
        - "**Metformin** is the initial drug treatment; reduces hepatic gluconeogenesis."
        - "**Dual therapy** adds a sulfonylurea, DPP-4 inhibitor, GLP-1 agonist or SGLT inhibitor — stepwise, checking tolerability and effectiveness of each drug."
        - "**Triple therapy** if dual therapy does not succeed."
        - "**Insulin** if there is still no control — and after `10–20 years`, almost all Type 2 patients will need it."

